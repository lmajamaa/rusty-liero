# Build tooling. The repo is mounted at /src and build output goes to build/.
#
#   docker compose run --rm native                  # build tctool for Linux
#   docker compose run --rm native tools/tctool/target/release/tctool <path-to-tc>
#   docker compose run --rm web                     # shell with cargo, wasm-bindgen and bun

services:
  native:
    build:
      context: .
      dockerfile: Dockerfile.native
    volumes:
      - .:/src
    command: cargo build --release --manifest-path tools/tctool/Cargo.toml

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    volumes:
      - .:/src
    command: bash
