[package]
name = "liero-game"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
description = "Game code ported from C++ to Rust, linked into openliero as a static library, and the hash run"

[lib]
name = "liero_game"
path = "src/lib.rs"
# rlib for the hash run (src/bin/liero-hashrun.rs).
crate-type = ["staticlib", "rlib"]

[dependencies]
liero-data = { path = "../liero-data" }
# Replays' deflate streams and zipped TCs, as miniz.c did. Agreed 2026-11-08.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

# A panic must never unwind into C++, so it aborts instead.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
