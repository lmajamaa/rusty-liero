name: Pages

on:
  release:
    types: [published]

# Each job asks for what it needs.
permissions: {}

# One deployment at a time. A deployment in progress is allowed to finish, and
# only the newest waiting run deploys after it.
concurrency:
  group: pages
  cancel-in-progress: false

# The versions match .github/workflows/test.yml's.
env:
  RUST_VERSION: 1.100.0
  WASM_BINDGEN_VERSION: 0.2.129
  BUN_VERSION: 1.4.4

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Install the wasm-bindgen CLI
        run: cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build the site
        run: |
          bun tools/web/build.ts --out=build/site
          ls -l build/site

      - name: Check the page only uses relative URLs
        run: |
          if grep -nE '(src|href)="/|from "/' build/site/index.html; then
            echo "index.html has root-relative URLs, which break under /rusty-liero/" >&2
            exit 1
          fi
          grep -q 'from "./liero_game.js"' build/site/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v5
