# Builds and tests everything with the same Docker images as local builds
# (docker-compose.yml), so CI uses the pinned emsdk, Rust and cbindgen versions.
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web build and Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the web toolchain image
        run: docker compose build web

      - name: Rust tests (native)
        run: docker compose run --rm -T web sh -c "cd rust/liero-game && cargo test"

      - name: Rust tests (wasm, run with Bun)
        run: docker compose run --rm -T web sh -c "cd rust/liero-game && cargo test --target wasm32-unknown-emscripten"

      - name: Check the C header matches cbindgen's output
        run: |
          docker compose run --rm -T web sh -c "cd rust/liero-game && cbindgen --config cbindgen.toml --output include/liero_game.h"
          git diff --exit-code rust/liero-game/include/liero_game.h

      - name: Build the game
        run: docker compose run --rm -T web sh -c "emcmake cmake -S . -B build/web -DCMAKE_BUILD_TYPE=Release && cmake --build build/web -j"

  native:
    name: Native tools
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the native toolchain image
        run: docker compose build native

      - name: Build the C++ tctool
        run: docker compose run --rm -T native

      - name: Build the Rust tctool
        run: docker compose run --rm -T native cargo build --release --manifest-path tools/tctool/Cargo.toml
