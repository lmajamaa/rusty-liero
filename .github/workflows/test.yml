# Builds and tests everything. Tools are installed directly on the runner; the
# versions match the pins in Dockerfile.web and Dockerfile.native, which are for
# local builds. Change them together.
#
# Rust comes from the rustup that GitHub-hosted runners include, as in GitHub's
# Rust guide. Actions are GitHub's own, plus Oven's setup-bun.
name: Test

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

env:
  RUST_VERSION: 1.87.0
  # The wasm-bindgen CLI must match the crate's pin in rust/liero-game. It
  # needs a newer Rust to build than the game's, used only for that.
  WASM_BINDGEN_VERSION: 0.2.129
  WASM_BINDGEN_RUST_VERSION: 1.88.0
  BUN_VERSION: 1.4.4

jobs:
  web:
    name: Web build and Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Install the wasm-bindgen CLI
        run: |
          rustup toolchain install "$WASM_BINDGEN_RUST_VERSION" --profile minimal
          cargo +"$WASM_BINDGEN_RUST_VERSION" install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The web shell, which only the web build compiles; the native job
      # lints the rest.
      - name: Clippy (web shell)
        working-directory: rust/liero-game
        run: cargo clippy --lib --target wasm32-unknown-unknown --features hashrun-export -- -D warnings

      - name: Rust tests (native)
        working-directory: rust/liero-game
        run: cargo test

      - name: Build the game
        run: bun tools/web/build.ts

      # The same wasm with the hash run's export: its 64 KB stack, its files
      # in memory and its own maths.
      - name: Check game-state hashes against the original C++ (wasm)
        run: bun tools/hashrun/run.ts --wasm

  native:
    name: Native tools
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      - name: Formatting
        run: |
          for crate in rust/liero-game rust/liero-data tools/tctool; do
            cargo fmt --check --manifest-path "$crate/Cargo.toml"
          done

      - name: Clippy
        run: |
          for crate in rust/liero-game rust/liero-data tools/tctool; do
            cargo clippy --all-targets --manifest-path "$crate/Cargo.toml" -- -D warnings
          done

      - name: Build tctool
        run: cargo build --release --manifest-path tools/tctool/Cargo.toml

      # Converts a generated installation and compares the TC folder with
      # tools/tctool/tests/synthetic.sha256.
      - name: Test tctool's output
        run: cargo test --release --manifest-path tools/tctool/Cargo.toml

      - name: Test reading and writing TCs (liero-data)
        run: cargo test --manifest-path rust/liero-data/Cargo.toml

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Check game-state hashes against the original C++ (native)
        run: bun tools/hashrun/run.ts

      # With the game's files in memory, as the web build will keep them.
      - name: Check game-state hashes with the files in memory
        run: bun tools/hashrun/run.ts --tree
